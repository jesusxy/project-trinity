# Exact first rule from Nox; condition and output labels retain its configured values.
source:
  repository: https://github.com/jesusxy/bit-by-bit
  commit: 887e9735095f964ad024f9e29a9ee4d0cd7e345c
  path: nox/detections/rules.yaml
  url: https://github.com/jesusxy/bit-by-bit/blob/887e9735095f964ad024f9e29a9ee4d0cd7e345c/nox/detections/rules.yaml#L1-L10
  evaluation: nox/internal/rules/definition.go:EvaluateYAMLRule
  alert_mapping: nox/internal/rules/engine.go:Engine.EvaluateEvent
rules:
  - name: Suspicious Nmap Scan
    description: "Detects the use of nmap a common network scanning tool."
    technique_id: T1046
    severity: MEDIUM
    event_type: Process_Executed
    conditions:
      # trigger if the process_name is nmap
      - field: metadata.process_name
        operator: equals
        value: "nmap"
